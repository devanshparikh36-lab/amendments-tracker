name: Keep schedules active

# GitHub disables scheduled workflows in repositories with no commits for 60 days.
# This monthly no-op commit keeps the scraper schedule alive.
on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-keepalive
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add .last-keepalive
          git commit -m "keepalive: $(cat .last-keepalive)" || exit 0
          git push
