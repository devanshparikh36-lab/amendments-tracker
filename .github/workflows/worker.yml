name: Regulation tracker worker

on:
  schedule:
    - cron: "30 */6 * * *"      # every 6 hours (UTC); 06:00 / 12:00 / 18:00 / 00:00 IST
  workflow_dispatch:
    inputs:
      command:
        description: "Worker command"
        default: "run"
        type: choice
        options: [run, work, discover, seed, retag, prune, digest]
      limit:
        description: "Max jobs to process (run/work)"
        default: "500"

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_ENABLED: "false"
      MIN_DOCUMENT_YEAR: "2014"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REQUEST_DELAY_SECONDS: "1.0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt

      - name: Install OCR engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Apply migrations
        run: python cli.py migrate

      - name: Run worker
        run: |
          CMD="${{ github.event.inputs.command || 'run' }}"
          LIMIT="${{ github.event.inputs.limit || '500' }}"
          if [ "$CMD" = "run" ] || [ "$CMD" = "work" ]; then
            python cli.py "$CMD" --limit "$LIMIT"
          else
            python cli.py "$CMD"
          fi
