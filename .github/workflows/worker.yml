# The collector. Runs once a day at 07:00 IST on GitHub's hosted runners, with no machine of ours involved.
#
# 07:00 IST is the intent and the cron below is NOT how it is achieved. GitHub does not honour this schedule:
# measured over every run from 6 Sept to 12 Oct 2026, the `schedule` event arrived 4.8 to 7.2 hours late, and
# the lag grew steadily across those five weeks (4.9h average in the first week, 6.8h in the last). The run
# was created at that late moment -- `created_at` equals `run_started_at` -- so this is GitHub's scheduler
# delivering late, not a queue waiting for a runner. Collection was starting at ~13:00 IST and the mail that
# depends on it was going out mid-afternoon.
#
# So the real trigger is external: a Cloudflare Worker (infra/trigger/) calls workflow_dispatch at 01:30 UTC.
# Dispatch events are delivered immediately; only `schedule` is subject to the delay above.
#
# The cron is kept as a fallback for the day the external trigger does not fire -- an expired token, a
# Cloudflare outage, a deleted Worker -- because the alternative is collection stopping silently. It arrives
# hours late by definition, so the `decide` job below turns it into a no-op whenever the external trigger has
# already collected today. On a normal day the fallback costs about half a minute.
#
# Once a day is both what is wanted and what is affordable. Regulators publish a handful of documents a week --
# MCA issued four General Circulars in eight months -- so six-hourly polling was buying nothing and costing
# four times as much. Discovery is about 16 minutes a pass, so once daily is roughly 500 minutes a month
# against the 2,000 a private repository gets; four times a day was ~1,980, the entire allowance with nothing
# spare, which is how collection stopped dead on 8 September.
#
# The uncertainty in that budget is CBIC and SEBI (below). If they burn their retry timeouts -- 131 minutes
# across the five on 11 Sept -- a daily run costs far more than the discovery figure suggests. Watch the first
# few runs before trusting the headroom.
#
# Watch CBIC and SEBI here. Those five adapters returned zero from GitHub's runners on 11 Sept while returning
# their full counts from a residential connection, and the cause was never established -- the runner-side logs
# went unread. EmptyDiscovery now fails the run rather than recording a green zero, so if it is still happening
# this workflow will say so instead of looking healthy.

# Named, and the name matters. Until now this workflow had no `name:` at all, so GitHub called it
# ".github/workflows/worker.yml" -- which is what `workflow_run` would have had to match on to chain the
# digest to it. Renaming it here is what lets digest.yml say "Collect from the regulators" and mean it.
name: Collect from the regulators

on:
  schedule:
    # 01:30 UTC. Nominally 07:00 IST; in practice GitHub delivers this around 13:00 IST (see the header).
    # This is the fallback path, not the intended one -- the Cloudflare Worker fires the same workflow by
    # workflow_dispatch at 01:30 UTC and that one actually lands on time.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Worker command"
        default: "run"
        type: choice
        options: [run, work, discover, seed, retag, requeue, pageindex, refetch, ocr, prune, digest]
      limit:
        description: "Max jobs to process (run/work)"
        default: "500"

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  # Whether the collection below is worth running at all.
  #
  # This exists only so the fallback cron can be kept without paying for it. It asks the database one
  # question -- has a collection already succeeded today? -- and nothing else. No checkout, no requirements,
  # no Playwright: about twenty seconds, against the 75-154 minutes a real run takes.
  #
  # Only a scheduled run can be skipped. A workflow_dispatch always proceeds, whether it came from the
  # Cloudflare Worker or from a person pressing the button, because the point of pressing it is to make it
  # run now. That also means this guard cannot strand collection: if the external trigger fires, it is a
  # dispatch and is never second-guessed.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A skipped step leaves an empty output, and an empty string is falsey in a GitHub expression, so
      # `|| 'true'` is what lets a dispatch through without running the check at all. A check that did run
      # and said "false" leaves the non-empty string "false", which is *truthy* here, so `||` returns that
      # "false" instead of overriding it. Correct, but by a rule that reads backwards -- hence this note.
      proceed: ${{ steps.check.outputs.proceed || 'true' }}
    steps:
      # setup-python rather than the runner's own python3. The system interpreter on Ubuntu 24.04 is
      # externally managed (PEP 668) and `pip install` into it fails outright; this gives a clean
      # interpreter where it just works, for about five seconds.
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule'
        with:
          python-version: "3.12"

      - name: Has today's collection already happened?
        id: check
        if: github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -q "psycopg[binary]"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, psycopg

          # "Today" is decided in IST, not UTC. A UTC date rolls over at 05:30 IST -- an hour and a half
          # before collection is meant to start -- so a UTC "today" would be the wrong day for exactly the
          # window this whole arrangement exists to hit.
          SQL = """
              SELECT count(*) FROM source_run
              WHERE ok
                AND (started_at AT TIME ZONE 'Asia/Kolkata')::date
                  = (now() AT TIME ZONE 'Asia/Kolkata')::date
          """

          # A database that will not answer is not a reason to skip collection. Proceeding costs, at worst,
          # a duplicate run; skipping could cost a day with no collection and no sign that anything was
          # wrong. This job is the safety net, so it fails towards doing the work.
          try:
              with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as conn:
                  already = conn.execute(SQL).fetchone()[0] > 0
          except Exception as exc:
              print(f"database unreachable ({exc.__class__.__name__}); collecting anyway", file=sys.stderr)
              already = False
          else:
              print("already collected today" if already else "nothing collected yet today", file=sys.stderr)

          # stdout is redirected into $GITHUB_OUTPUT, so this line and nothing else may go there. Every
          # diagnostic above is deliberately on stderr, which lands in the run log instead.
          print("proceed=" + ("false" if already else "true"))
          PY

  run:
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_ENABLED: "false"
      MIN_DOCUMENT_YEAR: "2014"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REQUEST_DELAY_SECONDS: "1.0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt

      - name: Install OCR engine and X server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr xvfb > /dev/null

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Install Chromium (for sites that block scripted clients)
        run: python -m playwright install --with-deps chromium

      - name: Apply migrations
        run: python cli.py migrate

      - name: Run worker
        run: |
          CMD="${{ github.event.inputs.command || 'run' }}"
          LIMIT="${{ github.event.inputs.limit || '500' }}"
          if [ "$CMD" = "run" ] || [ "$CMD" = "work" ]; then
            python cli.py "$CMD" --limit "$LIMIT"
          else
            python cli.py "$CMD"
          fi

      # Everything below was documented as happening and was not happening.
      #
      # docs/HANDOFF.md described this workflow as "discover -> fetch -> tag -> page index -> OCR" and listed
      # the page-index and re-fetch backlogs as "running unattended". They were not: `cli.py run` is discovery
      # plus the job queue plus a storage check, and `pageindex`, `refetch` and `ocr` are separate subcommands
      # with no job type behind them, so nothing ever invoked them once the Windows tasks were disabled on
      # 14 Sept. The result was 2,974 attachments waiting to be page-indexed and 836 holding an Imperva bot
      # wall instead of a document, both standing still for three weeks while the run reported green.
      #
      # Each step is bounded and each is `if: always()` with a soft failure, because none of them is the
      # collection: a page index that fails must not turn a successful fetch of today's notifications red,
      # and must not stop the steps after it.
      - name: Re-fetch attachments that hold an anti-bot page instead of a document
        if: always() && (github.event.inputs.command || 'run') == 'run'
        continue-on-error: true
        run: |
          python cli.py refetch --limit 400
          # Only the re-fetches, not the whole queue: the queue is strictly oldest-first, so without --type
          # these sit behind every tagging and self-check job and a bounded pass reaches none of them.
          python cli.py work --limit 400 --type fetch_document

      - name: Index PDF pages, so in-PDF search can land on the right page
        if: always() && (github.event.inputs.command || 'run') == 'run'
        continue-on-error: true
        run: python cli.py pageindex --limit 400

      # Finds nothing in about six seconds on an ordinary day. The budget is a ceiling for a day that brings
      # a pile of scans, not a cost paid every run -- OCR is ~0.3 seconds a page.
      - name: Read any newly arrived scans that carry no text layer
        if: always() && (github.event.inputs.command || 'run') == 'run'
        continue-on-error: true
        run: python cli.py ocr --minutes 20

      # The privacy page promises that the wording of a failed search is erased after 90 days. This is the
      # step that makes that true, so it is not optional furniture -- if it stops running, a published
      # statement quietly becomes false. Outcomes and counts stay; they identify nobody.
      - name: Erase the wording of searches older than the stated window
        if: always() && (github.event.inputs.command || 'run') == 'run'
        continue-on-error: true
        run: python cli.py forget

      # Reported last and loudly, because the steps above are allowed to fail quietly and a backlog that
      # never shrinks is the failure this whole block exists to end.
      - name: Report what is still queued
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from amendments import db
          with db.transaction() as conn:
              for label, sql in [
                  ("attachments still to page-index",
                   "SELECT count(*) AS n FROM attachment WHERE storage_key IS NOT NULL AND page_index_key IS NULL"),
                  ("attachments with no stored file",
                   "SELECT count(*) AS n FROM attachment WHERE storage_key IS NULL"),
                  ("jobs failed and not retrying",
                   "SELECT count(*) AS n FROM job WHERE status = 'failed'"),
              ]:
                  print(f"{label:38} {db.fetch_one(conn, sql)['n']:>7}")
          PY
