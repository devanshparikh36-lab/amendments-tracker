# The collector. Runs once a day at 07:00 IST on GitHub's hosted runners, with no machine of ours involved.
#
# Once a day is both what is wanted and what is affordable. Regulators publish a handful of documents a week --
# MCA issued four General Circulars in eight months -- so six-hourly polling was buying nothing and costing
# four times as much. Discovery is about 16 minutes a pass, so once daily is roughly 500 minutes a month
# against the 2,000 a private repository gets; four times a day was ~1,980, the entire allowance with nothing
# spare, which is how collection stopped dead on 8 September.
#
# The uncertainty in that budget is CBIC and SEBI (below). If they burn their retry timeouts -- 131 minutes
# across the five on 11 Sept -- a daily run costs far more than the discovery figure suggests. Watch the first
# few runs before trusting the headroom.
#
# Watch CBIC and SEBI here. Those five adapters returned zero from GitHub's runners on 11 Sept while returning
# their full counts from a residential connection, and the cause was never established -- the runner-side logs
# went unread. EmptyDiscovery now fails the run rather than recording a green zero, so if it is still happening
# this workflow will say so instead of looking healthy.
on:
  schedule:
    - cron: "30 1 * * *"        # 01:30 UTC = 07:00 IST, once a day
  workflow_dispatch:
    inputs:
      command:
        description: "Worker command"
        default: "run"
        type: choice
        options: [run, work, discover, seed, retag, requeue, pageindex, refetch, ocr, prune, digest]
      limit:
        description: "Max jobs to process (run/work)"
        default: "500"

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_ENABLED: "false"
      MIN_DOCUMENT_YEAR: "2014"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REQUEST_DELAY_SECONDS: "1.0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt

      - name: Install OCR engine and X server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr xvfb > /dev/null

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Install Chromium (for sites that block scripted clients)
        run: python -m playwright install --with-deps chromium

      - name: Apply migrations
        run: python cli.py migrate

      - name: Run worker
        run: |
          CMD="${{ github.event.inputs.command || 'run' }}"
          LIMIT="${{ github.event.inputs.limit || '500' }}"
          if [ "$CMD" = "run" ] || [ "$CMD" = "work" ]; then
            python cli.py "$CMD" --limit "$LIMIT"
          else
            python cli.py "$CMD"
          fi

      # Everything below was documented as happening and was not happening.
      #
      # docs/HANDOFF.md described this workflow as "discover -> fetch -> tag -> page index -> OCR" and listed
      # the page-index and re-fetch backlogs as "running unattended". They were not: `cli.py run` is discovery
      # plus the job queue plus a storage check, and `pageindex`, `refetch` and `ocr` are separate subcommands
      # with no job type behind them, so nothing ever invoked them once the Windows tasks were disabled on
      # 14 Sept. The result was 2,974 attachments waiting to be page-indexed and 836 holding an Imperva bot
      # wall instead of a document, both standing still for three weeks while the run reported green.
      #
      # Each step is bounded and each is `if: always()` with a soft failure, because none of them is the
      # collection: a page index that fails must not turn a successful fetch of today's notifications red,
      # and must not stop the steps after it.
      - name: Re-fetch attachments that hold an anti-bot page instead of a document
        if: always() && (github.event.inputs.command || 'run') == 'run'
        continue-on-error: true
        run: |
          python cli.py refetch --limit 400
          # Only the re-fetches, not the whole queue: the queue is strictly oldest-first, so without --type
          # these sit behind every tagging and self-check job and a bounded pass reaches none of them.
          python cli.py work --limit 400 --type fetch_document

      - name: Index PDF pages, so in-PDF search can land on the right page
        if: always() && (github.event.inputs.command || 'run') == 'run'
        continue-on-error: true
        run: python cli.py pageindex --limit 400

      # Finds nothing in about six seconds on an ordinary day. The budget is a ceiling for a day that brings
      # a pile of scans, not a cost paid every run -- OCR is ~0.3 seconds a page.
      - name: Read any newly arrived scans that carry no text layer
        if: always() && (github.event.inputs.command || 'run') == 'run'
        continue-on-error: true
        run: python cli.py ocr --minutes 20

      # Reported last and loudly, because the steps above are allowed to fail quietly and a backlog that
      # never shrinks is the failure this whole block exists to end.
      - name: Report what is still queued
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from amendments import db
          with db.transaction() as conn:
              for label, sql in [
                  ("attachments still to page-index",
                   "SELECT count(*) AS n FROM attachment WHERE storage_key IS NOT NULL AND page_index_key IS NULL"),
                  ("attachments with no stored file",
                   "SELECT count(*) AS n FROM attachment WHERE storage_key IS NULL"),
                  ("jobs failed and not retrying",
                   "SELECT count(*) AS n FROM job WHERE status = 'failed'"),
              ]:
                  print(f"{label:38} {db.fetch_one(conn, sql)['n']:>7}")
          PY
