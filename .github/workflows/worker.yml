name: Regulation tracker worker

# MANUAL-ONLY FALLBACK. Collection now runs on the self-hosted runner in worker-residential.yml.
#
# The schedule is disabled because this workload cannot run free on GitHub-hosted runners: about an hour a run,
# four times a day, is ~7,200 minutes a month against the 2,000 included with GitHub Free on a private repo.
# It exhausted the allowance around 8 Sept 2026 and every job was refused thereafter ("the job was not started
# because recent account payments have failed or your spending limit needs to be increased"), which is how
# collection stopped without anything in the code being wrong.
#
# Keep this workflow: it is the way back if the self-hosted runner is retired, and it is worth dispatching
# manually after the monthly reset to compare GitHub-hosted behaviour against the residential runner --
# notably for CBIC and SEBI, which return zero from here and full counts from a residential IP.
on:
  # schedule:
  #   - cron: "30 */6 * * *"    # re-enable only if the self-hosted runner is abandoned AND minutes allow
  workflow_dispatch:
    inputs:
      command:
        description: "Worker command"
        default: "run"
        type: choice
        options: [run, work, discover, seed, retag, prune, digest]
      limit:
        description: "Max jobs to process (run/work)"
        default: "500"

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_ENABLED: "false"
      MIN_DOCUMENT_YEAR: "2014"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REQUEST_DELAY_SECONDS: "1.0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt

      - name: Install OCR engine and X server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr xvfb > /dev/null

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Install Chromium (for sites that block scripted clients)
        run: python -m playwright install --with-deps chromium

      - name: Apply migrations
        run: python cli.py migrate

      - name: Run worker
        run: |
          CMD="${{ github.event.inputs.command || 'run' }}"
          LIMIT="${{ github.event.inputs.limit || '500' }}"
          if [ "$CMD" = "run" ] || [ "$CMD" = "work" ]; then
            python cli.py "$CMD" --limit "$LIMIT"
          else
            python cli.py "$CMD"
          fi
