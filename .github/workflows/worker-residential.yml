name: Worker (self-hosted, residential IP)

# The primary collector. Runs the full pipeline on a self-hosted Windows runner, for two reasons:
#
#   1. Cost. A run takes about an hour, four times a day -- roughly 7,200 minutes a month against the 2,000
#      included with GitHub Free on a private repository, exhausted around the 8th of every month. Jobs on a
#      self-hosted runner consume no GitHub-hosted minutes at all, so the ceiling disappears entirely.
#   2. Reach. CBIC and SEBI return zero to GitHub's runners after tens of minutes of retries, and their exact
#      historical counts from an ordinary Indian IP in seconds. Requests from here leave a residential
#      connection. See docs/HANDOFF.md.
#
# worker.yml remains as the GitHub-hosted fallback, manual-only, for when this runner is retired or offline
# past a deadline that matters.
#
# The machine does NOT need to be awake at the scheduled moment: GitHub holds a job for up to 24 hours waiting
# for a self-hosted runner, so whenever this machine next comes online the queued run executes. If it is off
# for days, pending runs supersede one another rather than piling up.
# MANUAL-ONLY. Collection runs locally via the "Regulation Tracker collection" scheduled task, which needs no
# runner registration and no GitHub minutes. This schedule is commented out because a job queued for a label
# no runner claims sits in the queue for 24 hours and then fails -- generating a failure email a day about a
# runner nobody intends to register. Uncomment only after config.cmd has actually registered this machine.
on:
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  # Deliberately NOT worker.yml's group. A queued job owns its concurrency group, so sharing one with a
  # workflow that must keep running lets an offline runner block it indefinitely -- that already happened.
  group: worker-residential
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, windows, residential]
    timeout-minutes: 300
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_ENABLED: "false"
      MIN_DOCUMENT_YEAR: "2014"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REQUEST_DELAY_SECONDS: "1.0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # No apt-get and no Xvfb: this is Windows and has a real desktop, so headed Chromium runs as-is, and
      # playwright's --with-deps is Linux-only. Tesseract is not installed here, so OCR fallback for scanned
      # PDFs is unavailable; text PDFs extract normally.
      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Apply migrations
        run: python cli.py migrate

      # Exits non-zero if any adapter failed, so a broken collector fails the workflow and GitHub emails the
      # owner -- the only alerting channel here that costs nothing.
      - name: Discover and fetch
        run: python cli.py run --limit 500

      # Never leave a browser behind on a machine somebody actually uses.
      - name: Stop stray browsers
        if: always()
        shell: pwsh
        run: Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*ms-playwright*' } | Stop-Process -Force
