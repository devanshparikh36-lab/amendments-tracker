name: Daily email digest

# MANUAL-ONLY. The digest now runs from the local scheduled task, immediately after collection -- see
# services/pipeline/run-local.ps1. It reports what collection found, and collection is local, so if this
# machine was off there is nothing new to report; running it here on its own schedule would just mail an empty
# digest, and could not run at all until the Actions allowance resets on 1 Oct.
#
# Kept dispatchable for a one-off digest, and as the way back if collection ever returns to GitHub runners.
on:
  schedule:
    - cron: "30 2 * * *"        # 08:00 IST daily, after the 00:00 IST collection
  workflow_dispatch:

jobs:
  digest:
    # GitHub-hosted: a minute a day, ~30 a month against 2,000 included. Kept off the laptop so that the one
    # thing whose job is to tell you what changed does not depend on the laptop being awake, and so its own
    # failure raises a GitHub failure email. Cannot run until the allowance resets on 1 Oct.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python cli.py digest
