name: Daily email digest

on:
  schedule:
    - cron: "30 2 * * *"        # 08:00 IST daily
  workflow_dispatch:

jobs:
  digest:
    # Self-hosted for the same reason as the worker: GitHub-hosted minutes are exhausted around the 8th of
    # each month, and a digest that cannot run is a digest that tells nobody anything. Needs no browser, only
    # Python and the database.
    runs-on: [self-hosted, windows, residential]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python cli.py digest
