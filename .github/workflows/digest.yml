name: Daily email digest

on:
  schedule:
    - cron: "30 2 * * *"        # 08:00 IST daily
  workflow_dispatch:

jobs:
  digest:
    # GitHub-hosted: a minute a day, ~30 a month against 2,000 included. Kept off the laptop so that the one
    # thing whose job is to tell you what changed does not depend on the laptop being awake, and so its own
    # failure raises a GitHub failure email. Cannot run until the allowance resets on 1 Oct.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python cli.py digest
