name: Daily email digest

# Runs here, on a schedule. The note that used to sit here said this was manual-only because collection ran
# from a laptop -- neither half is true any more: collection moved to GitHub runners, nothing depends on that
# machine being awake, and the Actions allowance is unlimited on a public repository.
#
# It reports what collection found, so it has to run after collection, not before. It now waits for
# collection to finish instead of guessing when that will be.
#
# The guess was a cron an hour after the collector's. Collection takes 75 to 154 minutes, so an hour was
# never enough, and on 9 of the 29 days to 12 Oct 2026 this ran while collection was still going -- up to 63
# minutes early on 10 Oct. Those mails were not wrong, they were incomplete: they described an unfinished
# run, with no sign on the face of them that anything was missing. A `workflow_run` trigger ends that class
# of bug outright rather than widening the gap and hoping.
#
# It fires on completion, not on success. The collector exits non-zero when an adapter returns an empty
# discovery, and on those days the other eleven sources still collected normally -- withholding the mail
# would hide a real day's publishing because one regulator's site misbehaved. Collector health is reported
# by the collector's own red run and on /status; this mail is about what the regulators published. Only a
# cancelled run is skipped, because a cancelled run is one nobody wants the consequences of.
#
# It still only mails when there is something to say: new notifications or applied amendments. A quiet day
# sends nothing and still passes. A digest arriving every morning to say nothing happened is one you stop
# opening, and then the morning it matters looks like all the others.
#
# That quietness is also what makes the collector's fallback run safe. The watermark advances only when mail
# went out, so if collection runs twice in a day the second digest finds nothing new and stays silent -- no
# duplicate mail, no special-casing needed here.
on:
  workflow_run:
    # Matched by name, which is why worker.yml now has one. Until 12 Oct 2026 it had no `name:` at all and
    # GitHub called it ".github/workflows/worker.yml"; chaining to that would have been matching on a path
    # dressed up as a title.
    workflows: ["Collect from the regulators"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if nothing was found (to test the mail path)"
        type: boolean
        default: false
      since_days:
        description: "Look back this many days instead of resuming from the last digest (0 = normal)"
        type: string
        default: "0"

jobs:
  digest:
    # Everything except a cancelled collection. On a workflow_dispatch there is no `workflow_run` in the
    # event payload at all, so the left side is null, null is not the string 'cancelled', and a hand-run
    # digest goes ahead -- which is what the Force and Look-back buttons are for.
    if: github.event.workflow_run.conclusion != 'cancelled'
    # Kept off the laptop so that the one thing whose job is to tell you what changed does not depend on that
    # machine being awake, and so its own failure raises a GitHub failure email. Minutes are unlimited here
    # because the repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Mail. SMTP is used when SMTP_USER and SMTP_PASSWORD are both set, and Resend is the fallback
      # when they are not -- see services/pipeline/amendments/notify/email.py. SMTP_HOST and SMTP_PORT
      # are not secret and default to Gmail; they are passed anyway so that changing provider is a
      # secret to add rather than this file to edit.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      DIGEST_REPLY_TO: ${{ secrets.DIGEST_REPLY_TO }}
      DIGEST_UNSUBSCRIBE: ${{ secrets.DIGEST_UNSUBSCRIBE }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt
      - run: pip install -q -r requirements.txt
      # Both options are guarded on `inputs` existing at all, not just on their values. A scheduled run has
      # no inputs context, and `inputs.since_days != '0'` on its own is true when the value is absent -- which
      # would hand the daily job a --since-days flag with nothing after it.
      - run: >-
          python cli.py digest
          ${{ inputs.force && '--force' || '' }}
          ${{ inputs.since_days && inputs.since_days != '0' && format('--since-days {0}', inputs.since_days) || '' }}
