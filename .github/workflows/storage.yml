name: Free-tier watch

# Fails on purpose when Cloudflare R2 or Neon passes 60% of its free allowance. A failed scheduled workflow makes
# GitHub email the repository owner, which is the only alerting channel that costs nothing and needs no secret --
# the Teams webhook and Resend key are still unset. Red here means one thing only: storage is filling up.
#
# Neon is the tighter limit: past 500 MB the free plan stops accepting writes and collection halts. R2 just starts
# charging (~$0.015/GB/month) past 10 GB.
on:
  schedule:
    - cron: "0 2 * * *"        # daily, 07:30 IST
  workflow_dispatch:

jobs:
  check:
    # Self-hosted: GitHub-hosted minutes run out mid-month, and a free-tier alarm that stops running for three
    # weeks of every month is worse than no alarm, because its silence reads as "everything is fine".
    runs-on: [self-hosted, windows, residential]
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Report usage against the free limits
        run: python cli.py storage
