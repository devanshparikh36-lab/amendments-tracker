name: Build and deploy the site

# Builds the site on GitHub's runners and uploads the finished output to Netlify, instead of letting Netlify
# build it.
#
# Why: Netlify's free plan allows 300 build minutes a month and this repository exhausted them on 15 Sept,
# after which pushes kept succeeding and the site quietly stayed five commits behind. Build minutes measure
# time spent on Netlify's own build infrastructure, so a deploy of already-built files should not consume any.
# GitHub Actions minutes are unlimited here because the repository is public, so the build moves to the side
# that has capacity.
#
# Confirmed on 17 Sept, and it holds. Netlify support put it plainly -- "CLI BUILDS use 0 build minutes, we
# aren't building for you" -- and the Deploys page agrees: every entry reads "<sha> via GitHub Actions" and
# finishes in 8 to 11 seconds, against the five to ten minutes a Next.js build takes on their infrastructure.
#
# The account had already spent half its monthly allowance by then, all of it before builds were stopped,
# including the builds that failed on a missing DATABASE_URL -- minutes are counted from dependency install
# until the container finishes, whether or not the build succeeds. That figure stopped moving the moment
# builds were switched off.
#
# So if the usage ever climbs again, the cause is Netlify building, not this workflow deploying. Check the
# Deploys page for an entry that does not say "via GitHub Actions" before blaming anything here.
#
# IMPORTANT: turn off Netlify's own Git integration for this site once this works, or every push builds twice
# -- once here and once on Netlify, which is the opposite of the point. In Netlify: Site configuration >
# Build & deploy > Continuous deployment > stop builds.

on:
  push:
    branches: [main]
    # Only when the site itself changes. The pipeline, handoff notes and task scripts share this repository and
    # cannot affect what is served, so rebuilding for them is waste -- 27 of 35 builds on 12 Sept were exactly
    # that.
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  # A newer commit makes an in-flight deploy pointless, so cancel it rather than racing to publish an older one.
  group: deploy
  cancel-in-progress: true

env:
  # Pinned deliberately. `netlify-cli@latest` would mean the tool that builds the site could change without
  # anything in this repository changing -- a deploy that differs for reasons nobody can see in the diff.
  # Raise this on purpose, and watch the first run after you do.
  NETLIFY_CLI_VERSION: "27.6.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      # Confirm the token and site id point at the site we mean, before building anything for it.
      #
      # `netlify build` pulls the site's environment variables using these credentials. If the site id were
      # wrong, the build would succeed and deploy a correctly-built site to the wrong place -- or configured
      # from another site's variables. Both fail quietly, so the check is cheap insurance.
      - name: Confirm which site we are deploying to
        working-directory: apps/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CLI: netlify-cli@${{ env.NETLIFY_CLI_VERSION }}
        run: |
          npx --yes "$CLI" status --json > status.json
          # Written to a file rather than inlined: a regex with $ inside a shell run block is escaping waiting
          # to go wrong, and this check exists precisely to catch quiet mistakes.
          cat > check-site.cjs <<'CHECK'
          const s = require("./status.json");
          const site = s.siteData || {};
          const strip = (v) => (v && v.endsWith("/") ? v.slice(0, -1) : v || "");
          const live = strip(site.ssl_url || site.url);
          const want = strip(process.env.SITE_URL);
          console.log("site id resolves to:", site.name || "(unnamed)", live || "(no url)");
          if (want && live && live !== want) {
            console.error("::error::site id points at " + live + " but SITE_URL says " + want);
            process.exit(1);
          }
          if (!want) console.log("SITE_URL not set, so the destination could not be cross-checked");
          CHECK
          node check-site.cjs
          rm -f status.json check-site.cjs

      # `netlify build` runs the same build Netlify would, including @netlify/plugin-nextjs, and writes the
      # deployable output to .netlify/. It runs here, on this runner, which is the whole point.
      - name: Build
        working-directory: apps/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" build

      # `--no-build` is what stops the CLI building again here; the previous step already did that. The flag
      # used to be called `--prebuilt` and that name is gone in v27 -- the CLI answers an unknown flag by
      # printing its help text and exiting 2, which reads like a broken build rather than a renamed option.
      #
      # `--dir` is not optional, and leaving it off is a quiet failure rather than a loud one. Without it the
      # CLI falls back to `publish` in netlify.toml, which is `.next` -- the raw Next.js build directory. That
      # uploads successfully and serves a site, so everything reports green, but every asset lands one level
      # too high: the stylesheet the HTML asks for at /_next/static/css/x.css sits at /static/css/x.css, so
      # every page renders as unstyled markup. It also publishes .next/server/** and required-server-files.json
      # to anyone who asks.
      #
      # @netlify/plugin-nextjs assembles the real deployable tree in .netlify/static (v5.15.13; the sibling
      # .netlify/functions-internal and .netlify/edge-functions are picked up automatically). `netlify build`
      # knows that, but it is a separate CLI invocation from `netlify deploy`, and the publish directory the
      # plugin sets during the build does not survive into the deploy.
      - name: Deploy the built output
        working-directory: apps/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ ! -d .netlify/static ]; then
            echo "::error::.netlify/static does not exist -- the Next.js plugin did not produce its usual output."
            ls -la .netlify/ || true
            exit 1
          fi
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy --no-build --prod \
            --dir=.netlify/static \
            --message "${GITHUB_SHA::7} via GitHub Actions"

      # Proves the deploy actually carried this commit, rather than reporting success while the site stays
      # where it was -- which is precisely the failure this replaces.
      #
      # The stylesheet check is the important one. A deploy from the wrong directory serves every page with a
      # 200 and the right words in it, so title checks, health checks and byte counts all pass while the site
      # renders as naked markup. Asking the page which stylesheet it wants and then fetching that exact URL is
      # the only check that catches it, and it is how this failure was eventually found -- by eye, days late.
      - name: Verify the live site moved, and is styled
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set; skipping verification"
            exit 0
          fi
          sleep 15
          html=$(curl -sk --max-time 30 "$SITE_URL/")

          title=$(printf '%s' "$html" | grep -oE "<title>[^<]*</title>" || true)
          echo "live title: $title"
          case "$title" in
            *"As Amended"*) echo "  the rename is live, so this deploy carried current code" ;;
            *) echo "::warning::live title is not the expected one yet: $title" ;;
          esac

          css=$(printf '%s' "$html" | grep -oE '/_next/static/css/[^"]+\.css' | head -1)
          if [ -z "$css" ]; then
            echo "::error::the page references no stylesheet at all"
            exit 1
          fi
          code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL$css")
          echo "stylesheet $css -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::the stylesheet the page asks for is not being served (HTTP $code). The site is live but unstyled -- almost always the wrong --dir on the deploy step."
            exit 1
          fi

          # The raw Next.js build directory must NOT be what got published. If it is, this file exists at the
          # site root, and .next/server/** is public along with it.
          leak=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/required-server-files.json")
          if [ "$leak" = "200" ]; then
            echo "::error::/required-server-files.json is public, so the raw .next directory was deployed instead of .netlify/static"
            exit 1
          fi
          echo "  stylesheet serves, and the build directory is not exposed"

          # Two different searches must not return the same answers.
          #
          # Netlify's CDN keys its cache on selected query parameters rather than the whole URL, so a
          # cacheable JSON endpoint without a matching Netlify-Vary serves the first caller's results to
          # everybody. It fails fast, with plausible content, and looks perfect in every timing -- the
          # suggestions endpoint shipped exactly that way once.
          a=$(curl -sk --max-time 30 "$SITE_URL/api/suggest?q=80C")
          b=$(curl -sk --max-time 30 "$SITE_URL/api/suggest?q=LODR")
          if [ "$a" = "$b" ]; then
            echo "::error::/api/suggest returned identical results for 80C and LODR -- the CDN is serving one cached answer for every query. Check Netlify-Vary on that route."
            exit 1
          fi
          echo "  suggestions differ per query, so the cache is keyed correctly"
