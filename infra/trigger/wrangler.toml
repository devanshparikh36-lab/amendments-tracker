# The thing that actually makes collection happen at 07:00 IST.
#
# GitHub's own cron does not: measured across every scheduled run from 6 Sept to 12 Oct 2026, the `schedule`
# event arrived 4.8 to 7.2 hours late and the lag was growing by roughly half an hour a week. A Cloudflare
# cron trigger fires within a minute of its time, and a workflow_dispatch raised from it is delivered at
# once -- only GitHub's `schedule` event is subject to that delay.
#
# Cloudflare and not a third-party cron service because the R2 bucket is already here: no new account, no new
# company holding a token that can start jobs in the repository. Cron Triggers are included on the Workers
# free plan, and one invocation a day against 100,000 is not a number worth watching.

name = "as-amended-trigger"
main = "src/index.js"

# Deliberately conservative. Nothing here depends on a runtime flag -- it is one fetch -- and a date newer
# than the installed wrangler makes wrangler refuse to publish. Raise it freely if you ever need to.
compatibility_date = "2025-01-01"

# workers.dev is ON, reluctantly, and only until the trigger is proven.
#
# 13 Oct 2026: Cloudflare registered this Worker's crons -- the dashboard lists them with a correct "next
# run" -- and then never invoked it. Metrics for the whole day: 0 invocations, 0 errors, 0 CPU. Four test
# slots passed without the Worker running once.
#
# Every deploy made with workers_dev = false also printed "No targets deployed for as-amended-trigger", and
# the dashboard shows an active deployment only for the workers_dev = true upload. That is not proof a cron
# needs a deploy target -- the one slot tested in that configuration may have passed before the deploy
# landed -- but it is the only difference observed, and tomorrow's 01:30 UTC run is the real test. Better it
# runs in the configuration Cloudflare considers deployed.
#
# Turn this back to false the moment a cron invocation shows up in Metrics. The Worker has no fetch handler,
# so the URL serves nothing and exposes nothing -- but an endpoint that exists gets probed, and this one
# holds a token that can start jobs in the repository.
#
# Originally, and to return to:
#
# This Worker has only a `scheduled` handler -- there is no `fetch`, so there is nothing to serve and a
# public endpoint would be exposure bought for nothing. But wrangler assumes workers.dev is wanted unless
# told otherwise: deploying without this prompts to register a workers.dev subdomain, and declining the
# prompt fails the deploy outright ("deploy your worker to one or more routes ... or register a workers.dev
# subdomain"). Setting it false is how you decline permanently and deploy with no route at all.
#
# Cron triggers are unaffected. They do not need a route or a subdomain.
workers_dev = true

# And the preview URL too, which is a second public endpoint and is on by default.
#
# Wrangler says so only as a warning during deploy: "Because your 'workers.dev' route is enabled and your
# 'preview_urls' setting is not in your Wrangler file, Preview URLs will be enabled for this deployment by
# default." Turning workers_dev off is not enough on its own -- this is the other door.
preview_urls = false

[triggers]
# 01:30 UTC = 07:00 IST. Cloudflare crons are always UTC; there is no timezone setting to get wrong.
#
# Collection takes 75-154 minutes, so the mail that follows it lands between 08:15 and 09:35 IST, and on
# 2 of the 12 days measured that is after 09:00. If "by 09:00" has to hold every day, move this to
# "15 0 * * *" (06:15 IST) -- that clears every duration observed so far with room to spare.
crons = ["30 1 * * *"]

# No KV, no R2 binding, no D1. The only state this Worker needs is the token, and that is a secret:
#   wrangler secret put GITHUB_TOKEN
